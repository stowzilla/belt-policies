name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: >
          bundle exec rspec --format progress
          --format RspecJunitFormatter --out junit.xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.ruby-version == '3.4'
        with:
          name: junit-rspec
          path: junit.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: gem install bundler-audit
      - run: bundler-audit check --update

  # Reports the RSpec run to FeatureParity (project belt-policies, surface gem).
  # Skipped, with a green run, until the FP_API_KEY secret is added.
  feature-parity:
    needs: test
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    env:
      HAVE_FP_KEY: ${{ secrets.FP_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        if: env.HAVE_FP_KEY == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAVE_FP_KEY == 'true'
        with:
          name: junit-rspec
      - uses: ruby/setup-ruby@v1
        if: env.HAVE_FP_KEY == 'true'
        with:
          ruby-version: '3.4'
      - name: Report to FeatureParity
        if: env.HAVE_FP_KEY == 'true'
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
        run: |
          gem install featureparity
          args=(
            ci-report
            --junit junit.xml
            --surface gem
            --ci-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--pr "${{ github.event.pull_request.html_url }}")
          fi
          fp "${args[@]}"
