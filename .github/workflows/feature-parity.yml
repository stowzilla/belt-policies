# FeatureParity — parity enforcement.
#
# Generated by `fp init`. The gate is ready to use; adapt and uncomment the
# report recipe once this repository emits JUnit:
#
#   report  On trusted pull requests, report candidate test revisions before
#           merge. On default-branch pushes, record merged pass/fail and promote
#           an approved exact test revision into the accepted baseline.
#   gate    On pull requests, fail the build when the project violates its
#           enforcement level. Make this a required status check in branch
#           protection to actually block merges.
#
# The gate reads the project slug from .featureparity.yml, so it needs no
# hardcoded project name here.
name: Feature Parity

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: feature-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Parity gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Whether the FP_API_KEY secret exists on this repo. Every step that talks
    # to FeatureParity is guarded on this, so the very first push — before
    # anyone has added the secret — explains what to do instead of dying with a
    # bare "No API key found" from fp. Fork pull requests also can't read the
    # secret, and are skipped the same way.
    env:
      HAVE_FP_KEY: ${{ secrets.FP_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fp
        run: gem install featureparity

      # Without the secret there is nothing the gate can do yet, so say so
      # clearly (in the job summary and the log) and let the build pass. This is
      # the expected state right after `fp init`: the repo is onboarded, the
      # maintainer just hasn't added the key. A green, explanatory run beats a
      # red one nobody can action.
      - name: FeatureParity not configured yet
        if: env.HAVE_FP_KEY != 'true'
        run: |
          {
            echo '## FeatureParity gate skipped'
            echo ''
            echo 'The `FP_API_KEY` secret is not set on this repository, so the parity'
            echo 'gate cannot run yet. This is expected on the first push after `fp init`.'
            echo ''
            echo 'To enable the gate, add a repository secret named `FP_API_KEY`'
            echo '(Settings → Secrets and variables → Actions → New repository secret).'
            echo 'Mint a key at https://featureparity.dev (Account → Agents & API keys).'
            echo ''
            echo 'Fork pull requests cannot read the secret and will always show this.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'FP_API_KEY is not set — skipping the parity gate. See the job summary.'

      - name: Update PR requirement changes
        if: github.event_name == 'pull_request' && env.HAVE_FP_KEY == 'true'
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if fp help | grep -q -- '--github-pr'; then
            fp changes --github-pr --github-summary
          else
            echo '## FeatureParity requirement changes' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'The installed fp version cannot update the pull request description yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Exits non-zero when the project violates its enforcement level.
      # Add `--warn-only` while adopting if you need the annotations without
      # blocking merges yet.
      #
      # Guarded on HAVE_FP_KEY so a repo that hasn't added the secret yet gets
      # the explanatory step above instead of a bare "No API key found" failure.
      #
      # NOTE: as written this gates on what has been *recorded*, which on a pull
      # request is the default branch's state. To judge a branch on its own
      # results, emit JUnit in this job and pass it — nothing is saved:
      #
      #   fp check --surface <surface-key> --junit junit.xml
      #
      # That is also the only way to catch a test that was deleted, renamed, or
      # had its fp: marker stripped: the remaining tests still pass, so a plain
      # suite stays green while the requirement loses its only proof. Use one
      # call per surface.
      #
      # On a pull request add --pr so the verdict is about the change: only
      # parity the branch makes worse fails it, and what the default branch
      # already owes is listed, not counted. A push to the default branch gets
      # no --pr and the standing verdict:
      #
      #   fp check --surface <surface-key> --junit junit.xml --pr "${{ github.event.pull_request.html_url }}"
      - name: Check parity
        if: env.HAVE_FP_KEY == 'true'
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
        run: fp check

  # Uncomment and adapt once your suite emits JUnit XML. `fp ci-report` writes
  # real passing/failing evidence and one source fingerprint per bound testcase.
  # Run it on trusted pull requests too: `--pr` lets FeatureParity open a changed-test
  # finding before merge without replacing the accepted default-branch baseline.
  # The later default-branch report records merged truth and promotes an approved exact
  # fingerprint. Without reporting, the matrix only has agent-filed `present` markers
  # and changed bound tests cannot be detected.
  #
  # It reads the fp:<slug> markers out of the checkout, so run it in the repo
  # and pass --base-dir when the report's test-file paths are relative to a
  # subdirectory (vitest, for instance, reports them relative to its package).
  # Keep `if: always()` so red tests are reported. Fork pull requests cannot read
  # FP_API_KEY and are skipped by the HAVE_FP_KEY guard.
  #
  # report:
  #   name: Report evidence
  #   if: github.event_name == 'push' || github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   env:
  #     HAVE_FP_KEY: ${{ secrets.FP_API_KEY != '' }}
